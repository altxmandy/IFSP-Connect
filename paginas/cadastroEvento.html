    <main>
        <h1>Inscrição no evento</h1>
        <h2>Semana de Tecnologia e Inovação</h2>
        <p>Preencha os dados abaixo para se inscrever no evento do IFSP.</p>

        <form>
            <p>
                <label for="nome">Nome completo*:</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required>
            </p>
            <p>
                <label for="email">E-mail*:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </p>
            <p>
                <label for="prontuario">Prontuário (se estudante do IFSP):</label>
                <input type="text" id="prontuario" name="prontuario">
            </p>
            <p>
                <label for="curso">Curso ou instituição:</label>
                <input type="text" id="curso" name="curso">
            </p>
            <p>
                <label for="telefone">Telefone*:</label>
                <input type="tel" id="telefone" name="telefone" autocomplete="tel">
            </p>
            <p>
                <label for="observacoes">Observações ou necessidades de acessibilidade:</label>
                <br>
                <textarea id="observacoes" name="observacoes" rows="5" cols="40"></textarea>
            </p>
            <p>
                <button type="submit">Enviar inscrição</button>
                <button type="reset">Limpar formulário</button>
            </p>
        </form>
    </main>
